# Origin cache headers for mint.ysk.hk (nginx include).
# Cloudflare proxy is on: CDN-Cache-Control is what the edge uses.
# Replace a site-wide "Cache Everything" rule with the dashboard rules in docs/architecture.md.

location = /version.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    add_header CDN-Cache-Control "no-store" always;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /tokens/ {
    add_header Cache-Control "no-cache" always;
    add_header CDN-Cache-Control "no-cache" always;
}

location ~* \.(html)$ {
    add_header Cache-Control "no-cache" always;
    add_header CDN-Cache-Control "no-store" always;
}

location ~* \.(txt|svg|xml|webmanifest)$ {
    add_header Cache-Control "no-cache" always;
    add_header CDN-Cache-Control "no-cache" always;
}

# Browser Koios (account_utxos / account_info) — upstream POST has no ACAO.
# Cloudflare: Bypass cache for /koios*.
location /koios/ {
    proxy_pass https://api.koios.rest/api/v1/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.koios.rest;
    proxy_set_header Origin "";
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store";
    add_header CDN-Cache-Control "no-store" always;
}

# SPA fallback (include after the locations above)
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header CDN-Cache-Control "no-store" always;
}
