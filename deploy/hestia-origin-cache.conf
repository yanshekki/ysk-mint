# Hestia drop-in for mint.ysk.hk — NOT a full server block.
# Only /koios/ belongs here. Do not add location /assets/, /tokens/,
# /version.json, or location / — those steal static files from Hestia's
# proxy/root and 404 the SPA (blank page). Cache headers stay on Cloudflare.
#
# SSH as root (replace USER):
#   install -m 644 deploy/hestia-origin-cache.conf \
#     /home/USER/conf/web/mint.ysk.hk/nginx.ssl.conf_origin-cache
#   ln -sf nginx.ssl.conf_origin-cache \
#     /home/USER/conf/web/mint.ysk.hk/nginx.conf_origin-cache
#   nginx -t && systemctl reload nginx
#
# Cloudflare: Bypass /version.json, /koios*, *.html, and /.
# Cache Rule: /assets/* Eligible, Edge TTL 1 year.
# Do not assign Hestia's caching / proxy-cache template to this domain.

location /koios/ {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;
    proxy_pass https://api.koios.rest/api/v1/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.koios.rest;
    proxy_set_header Origin "";
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store";
    add_header CDN-Cache-Control "no-store" always;
}
